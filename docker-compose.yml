services:
  erp:
    build: .
    # 显式给镜像起名，和 Docker Hub 上的一致：
    #   - 源码构建时 `docker compose build` 打上这个 tag
    #   - 只想跑现成镜像时，删掉上面 build: 这行，`docker compose up -d` 会去 Hub 拉
    image: aag111/suteng-erp:latest
    container_name: suteng-erp
    restart: unless-stopped
    # 禁止容器内进程通过 setuid/setgid 提权。零副作用，防的是「应用被攻破后
    # 借某个带 suid 位的二进制再往上爬」这条路。勒索病毒最爱这一手。
    security_opt:
      - no-new-privileges:true
    # 想再收紧可加 cap_drop: [ALL]。前提是宿主机 ./data 属主是 root（容器当前也以 root 跑）——
    # 去掉 CAP_DAC_OVERRIDE 之后 root 不再无敌，目录属主不对会直接写不进库。
    # 换用户跑（user: "1000:1000"）之前必须先 chown -R 1000:1000 ./data，否则启动即失败。
    ports:
      # HOST_PORT 可在 .env 里改，NAS 上若 3000 被占用就设成别的（如 3080）
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # 容器默认 UTC 会让「本月」统计在月初月末差 8 小时，必须固定时区
      TZ: Asia/Shanghai
      # 容器内绝对路径；数据落在挂载出来的 ./data
      DATABASE_URL: "file:/app/data/suteng.db"
      JWT_SECRET: "${JWT_SECRET:?请先设置 JWT_SECRET，可用 node -e \"console.log(require('crypto').randomBytes(48).toString('base64url'))\" 生成}"
      ACCESS_TOKEN_TTL: "28800"
      REFRESH_TOKEN_TTL: "6048000"
      # 容器内绝对路径，默认跟数据库一起放在 /app/data 下，由下面的 ./data 整卷带出去。
      # 想把图片单独放别的盘，改这里 + 加一条 volume，两处必须对上：
      #   UPLOAD_DIR: "/app/uploads"
      #   volumes:
      #     - /data/suteng/uploads:/app/uploads
      # 注意填的是「容器内」路径，不是宿主机路径；只改这里不加挂载，
      # 图片会写在容器可写层，重建容器就没了，且不会有任何报错。
      UPLOAD_DIR: "/app/data/uploads"
      UPLOAD_MAX_MB: "5"
      APP_NAME: "半巷设计 ERP"
      # 首次启动（库里一个用户都没有）时创建的管理员。已有用户时这几行不生效，
      # 不会把已经改过的密码覆盖回去。
      # 不填密码就随机生成一个 16 位口令，打印在启动日志里（docker logs suteng-erp）。
      # **不要再写回固定默认口令**：公网服务器上那就是给全网留的钥匙。
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      BOOTSTRAP_ADMIN_NAME: "${BOOTSTRAP_ADMIN_NAME:-管理员}"
      LOG_LEVEL: "info"
    volumes:
      # SQLite 与图片必须放在本地磁盘，不能是 SMB / NFS 共享盘
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
